<script>
    // Inicialización de Datos por Defecto
    const DEFAULT_DATA = {
        items: [
            { id: 1, name: 'Bolsa 2.5 kg (Materia Prima)', qty: 10, unit: 'unidades' },
            { id: 2, name: 'Empaque Lucardih 500g', qty: 50, unit: 'unidades' },
            { id: 3, name: 'Empaque Lucardih 250g', qty: 50, unit: 'unidades' }
        ],
        sales: [],
        debts: []
    };

    let appData = JSON.parse(localStorage.getItem('lucardih_app_data')) || DEFAULT_DATA;

    function saveData() {
        localStorage.setItem('lucardih_app_data', JSON.stringify(appData));
        renderAll();
    }

    function renderAll() {
        renderInventory();
        renderSales();
        renderDebts();
        renderSummary();
    }

    // --- LÓGICA DE FRACCIONAMIENTO Y BOLSA DE CONSUMO ---
    function processConsumableBag(weightInKg) {
        // Buscar o crear el ítem 'Bolsa de Consumo 2.5 kg'
        let consumableItem = appData.items.find(item => item.name === 'Bolsa de Consumo 2.5 kg');
        
        if (!consumableItem) {
            consumableItem = {
                id: Date.now(),
                name: 'Bolsa de Consumo 2.5 kg',
                qty: 2.5, // Empieza con 2.5 kg completos
                unit: 'kg'
            };
            appData.items.push(consumableItem);
        }

        // Si los kilos actuales no alcanzan para el descuento, toma una bolsa nueva de 2.5 kg del stock principal
        if (consumableItem.qty < weightInKg) {
            let mainBag = appData.items.find(item => item.name.includes('2.5 kg') && item.id !== consumableItem.id);
            if (mainBag && mainBag.qty > 0) {
                mainBag.qty -= 1;
                consumableItem.qty += 2.5; // Agrega 2.5 kg de la nueva bolsa
            }
        }

        // Descontar el peso fraccionado (ej: 0.5 kg para libra)
        consumableItem.qty = Math.max(0, parseFloat((consumableItem.qty - weightInKg).toFixed(2)));
    }

    // --- GESTIÓN DE VENTAS ---
    function addSale(description, total, weightInKg = 0) {
        const newSale = {
            id: Date.now(),
            date: new Date().toLocaleDateString('es-CO'),
            description: description,
            total: parseFloat(total)
        };
        appData.sales.unshift(newSale);

        // Si la venta no es de bolsa de 2.5 kg completa y tiene un peso especificado, descuenta de la Bolsa de Consumo
        if (weightInKg > 0 && weightInKg < 2.5) {
            processConsumableBag(weightInKg);
        }

        saveData();
    }

    // --- GESTIÓN Y EDICIÓN DE CUENTAS POR PAGAR ---
    function editDebt(id) {
        const debt = appData.debts.find(d => d.id === id);
        if (!debt) return;

        const newPerson = prompt('Editar Nombre/Proveedor (Ej: Fer, Insumos):', debt.person || 'Fer');
        if (newPerson === null) return;

        const newConcept = prompt('Editar Concepto:', debt.concept);
        if (newConcept === null) return;

        const newTotal = prompt('Editar Valor Total ($):', debt.total);
        if (newTotal === null) return;

        const newAbonos = prompt('Editar Abonos Realizados ($):', debt.abonos);
        if (newAbonos === null) return;

        debt.person = newPerson.trim() || 'Fer';
        debt.concept = newConcept.trim();
        debt.total = parseFloat(newTotal) || 0;
        debt.abonos = parseFloat(newAbonos) || 0;

        saveData();
    }

    // --- RENDERIZADO Y EXPORTACIÓN ---
    function renderInventory() {
        const container = document.getElementById('inventoryList');
        if (!container) return;
        container.innerHTML = appData.items.map(item => `
            <div class="flex justify-between items-center p-3 bg-stone-50 rounded-lg border border-stone-200 mb-2">
                <div>
                    <p class="font-bold text-stone-800">${item.name}</p>
                    <p class="text-sm text-stone-500">Disponible: ${item.qty} ${item.unit}</p>
                </div>
                <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-800 text-sm font-semibold">Eliminar</button>
            </div>
        `).join('');
    }

    function renderDebts() {
        const container = document.getElementById('debtsList');
        if (!container) return;
        container.innerHTML = appData.debts.map(d => {
            const pending = Math.max(0, d.total - d.abonos);
            return `
                <div class="p-3 bg-stone-50 rounded-lg border border-stone-200 mb-2 flex justify-between items-center">
                    <div>
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">${d.person || 'Fer'}</span>
                        <p class="font-bold text-stone-800 mt-1">${d.concept}</p>
                        <p class="text-xs text-stone-500">Total: $${d.total.toLocaleString('es-CO')} | Abono: $${d.abonos.toLocaleString('es-CO')}</p>
                        <p class="text-sm font-bold text-red-600">Pendiente: $${pending.toLocaleString('es-CO')}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editDebt(${d.id})" class="text-blue-600 hover:text-blue-800 text-xs font-bold border border-blue-200 px-2 py-1 rounded">✏️ Editar</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderSummary() {
        const salesTotal = appData.sales.reduce((acc, s) => acc + (s.total || 0), 0);
        const debtsTotal = appData.debts.reduce((acc, d) => acc + Math.max(0, d.total - d.abonos), 0);

        document.getElementById('summaryTotalSales').innerText = '$' + salesTotal.toLocaleString('es-CO');
        document.getElementById('summaryTotalDebts').innerText = '$' + debtsTotal.toLocaleString('es-CO');
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function exportDataJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Lucardih_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importDataJSON(e) {
        const fileReader = new FileReader();
        fileReader.onload = function (event) {
            try {
                const imported = JSON.parse(event.target.result);
                if (imported && imported.items) {
                    appData = imported;
                    saveData();
                    alert('✅ Copia de seguridad restaurada con éxito.');
                } else {
                    alert('❌ El archivo no tiene el formato correcto.');
                }
            } catch (err) {
                alert('❌ Error al leer el archivo JSON.');
            }
        };
        if (e.target.files[0]) fileReader.readAsText(e.target.files[0]);
    }

    function resetDataDefault() {
        if (confirm('⚠️ ¿Estás seguro de reiniciar la app con los datos de fábrica?')) {
            appData = DEFAULT_DATA;
            saveData();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderAll();
    });
</script>
</body>
</html>
